name: Update goals

on:
  schedule:
    - cron: "7 * * * *"   # every hour at minute 7 (UTC)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest stats
        run: python scripts/update_stats.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PLAYER_ID: ${{ secrets.PLAYER_ID }}
      - name: Commit changes
        run: |
          git config user.name "goal-bot"
          git config user.email "goal-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "Update goal stats" && git push)
